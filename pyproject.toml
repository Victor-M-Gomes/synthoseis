[project]
name = "synthoseis"
version = "0.1.0"
description = "Generate geological models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bruges>=0.5.4",
    "matplotlib",
    "noise>=1.2.2",
    "numpy<2",
    "plotly",
    "ruff>=0.10.0",
    "scikit-image",
    "scipy",
    "setuptools>=76.0.0",
    "tables>=3.9.2",
    "tqdm",
]

[tool.setuptools.packages.find]
# Use `where` and `exclude` to control package discovery (valid keys for setuptools)
where = ["src"]
exclude = [
    "config*",
    "notebooks*",
    "img*",
]
